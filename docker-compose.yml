services:
  docker-manager:
    build: .
    image: wannaverse/docker-manager:latest
    container_name: docker-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
      # DNS for your domains (DNS page): the server listens on 1053 in the container.
      # On hosts running systemd-resolved, see docs/dns.md if port 53 is already in use.
      # - "53:1053/udp"
      # - "53:1053/tcp"
    volumes:
      # Lets Docker Manager control this host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Database, and the secrets generated on first start.
      - docker_manager_data:/app/database
      # Compose stacks and checked-out git repositories. Keep the same path on both sides:
      # Docker resolves relative bind mounts in a compose file (./data) on the host, so the
      # folders must exist there under the same name.
      - /opt/docker-manager/stacks:/opt/docker-manager/stacks
      - /opt/docker-manager/git-repos:/opt/docker-manager/git-repos
    environment:
      # The address you open Docker Manager at. Used for webhook URLs and links in emails.
      - BASE_URL=http://localhost:8080
      # Optional. Strong random secrets are generated on first start and kept in the data
      # volume. To manage them yourself, set each to a random value of 32+ characters:
      #   openssl rand -base64 48
      # - JWT_ACCESS_SECRET=
      # - JWT_REFRESH_SECRET=
      # - ENCRYPTION_KEY=

volumes:
  docker_manager_data:
