services:
  docker-manager:
    build: .
    image: wannaverse/docker-manager:latest
    container_name: docker-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Lets Docker Manager control this host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Database, and the secrets generated on first start.
      - docker_manager_data:/app/database
      # Checked-out git repositories.
      - docker_manager_repos:/app/git-repos
      # Compose stacks. Keep the same path on both sides: Docker resolves relative bind mounts
      # in a stack's compose file (./data) on the host, so the folder must exist there too.
      - /opt/docker-manager/stacks:/opt/docker-manager/stacks
    environment:
      # The address you open Docker Manager at. Used for webhook URLs and links in emails.
      - BASE_URL=http://localhost:8080
      # Optional. Strong random secrets are generated on first start and kept in the data
      # volume. To manage them yourself, set each to a random value of 32+ characters:
      #   openssl rand -base64 48
      # - JWT_ACCESS_SECRET=
      # - JWT_REFRESH_SECRET=
      # - ENCRYPTION_KEY=

volumes:
  docker_manager_data:
  docker_manager_repos:
