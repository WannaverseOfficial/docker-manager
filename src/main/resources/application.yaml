spring:
  servlet:
    multipart:
      # Uploads into volumes (Volumes, browse files).
      max-file-size: 100MB
      max-request-size: 200MB
  application:
    name: docker-manager-starter

  datasource:
    url: jdbc:sqlite:database/data.db?journal_mode=WAL&busy_timeout=30000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    username:
    password:
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000

  jackson:
    deserialization:
      # Jackson 3 rejects requests that leave out a primitive field (a boolean or a number).
      # Treat a missing value as false/0 instead, as Jackson 2 did.
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false

  jpa:
    open-in-view: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate.ddl-auto: update
    properties:
      hibernate:
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

server:
  port: 8080
  # Honour X-Forwarded-* only from proxies on private networks (Tomcat's default list), so the
  # client address used for sign-in rate limiting cannot be spoofed.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/plain,image/svg+xml
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.wannaverse: ${LOG_LEVEL:INFO}

app:
  encryption:
    key: ${ENCRYPTION_KEY:change-this-in-production-32chars}
  base-url: ${BASE_URL:http://localhost:8080}
  # Where secrets generated on first start are kept (next to the database).
  data-dir: ${APP_DATA_DIR:database}
  # Compose stacks: one folder per stack with compose.yaml and .env. Mount this at the same path
  # on the host so relative bind mounts in compose files point at the same folder.
  stacks-dir: ${STACKS_DIR:stacks}
  cors:
    # Only needed when the UI is served from another origin (e.g. `next dev`).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  git:
    clone-dir: ${GIT_CLONE_DIR:git-repos}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-this-access-secret-32chars}
    refresh-secret: ${JWT_REFRESH_SECRET:change-this-refresh-secret-32chars}
    access-expiration-ms: ${JWT_ACCESS_EXP:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXP:604800000}

docker:
  health:
    monitor:
      enabled: ${DOCKER_HEALTH_MONITOR_ENABLED:true}
      interval: ${DOCKER_HEALTH_MONITOR_INTERVAL:30000}
      restart-loop-threshold: ${DOCKER_HEALTH_RESTART_THRESHOLD:3}
      restart-loop-window: ${DOCKER_HEALTH_RESTART_WINDOW:300000}
      notification-cooldown: ${DOCKER_HEALTH_NOTIFICATION_COOLDOWN:3600000}