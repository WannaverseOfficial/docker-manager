plugins {
    alias(libs.plugins.java)
    alias(libs.plugins.spotless)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

repositories {
    mavenCentral()
}

// Newer than Spring Boot's own choices, for security fixes (HttpCore 5.4.3+, used by docker-java).
ext['httpclient5.version'] = '5.6.5'
ext['httpcore5.version'] = '5.4.4'

dependencies {
    implementation platform(libs.slf4j.bom)
    implementation libs.bundles.jackson
    implementation libs.spring.openapi
    implementation libs.spring.boot
    implementation libs.spring.boot.web
    implementation libs.spring.boot.jpa
    implementation libs.spring.boot.validation

    implementation libs.sqlite
    implementation libs.hibernate.community.dialects
    implementation libs.bundles.docker
    implementation libs.bundles.jgit
    implementation libs.jasypt
    implementation libs.bundles.jjwt
    implementation libs.caffeine
    implementation libs.spring.boot.cache
    implementation libs.spring.boot.security
    implementation libs.spring.boot.mail
    implementation libs.bundles.acme4j

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    constraints {
        // docker-java still asks for 1.80, which has known vulnerabilities (fixed in 1.85).
        implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
        implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
        implementation 'org.bouncycastle:bcutil-jdk18on:1.86'
        // docker-java asks for 33.4.8, which has a known vulnerability (fixed in 33.7.2).
        implementation 'com.google.guava:guava:33.8.0-jre'
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

spotless {
    java {
        importOrder()
        googleJavaFormat()
                .aosp()
                .reflowLongStrings()
                .formatJavadoc(true)
                .reorderImports(true)
                .groupArtifact('com.google.googlejavaformat:google-java-format')
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
    groovyGradle {
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
}

// Bundle the UI when it has been built locally (`npm run build` in frontend/). The Docker build
// copies it into src/main/resources/static instead.
processResources {
    from('frontend/out') {
        into 'static'
    }
}

bootJar {
    manifest {
        attributes('Implementation-Version': project.findProperty('appVersion') ?: 'dev')
    }
}
